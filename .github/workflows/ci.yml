name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Dependency audit
        run: npm audit --audit-level=high
      - uses: astral-sh/setup-uv@v5
      - name: Secret scan
        run: uvx --from detect-secrets==1.5.0 detect-secrets scan --baseline .secrets.baseline --exclude-files '\.secrets\.baseline$'
      - run: npm run build
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
